<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — OutreachNest</title>
<meta name="description" content="Practical insights on guest posting, lead generation, outreach, and SEO from the OutreachNest team.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>window.PAGE_KEY='blog';</script>
</head>
<body>
<div id="nav-holder"></div>

<header class="page-head">
  <div class="glow"></div>
  <div class="wrap">
    <span class="tag">From the nest</span>
    <h1>Insights on links, leads &amp; outreach</h1>
    <p>Practical, no-fluff advice on guest posting, lead generation, deliverability, and SEO — written from real experience.</p>
  </div>
</header>

<section style="padding-top:40px">
  <div class="wrap">
    <div class="blog-grid" id="blogGrid"></div>
  </div>
</section>

<div id="footer-holder"></div>
<script src="posts.js"></script>
<script src="main.js"></script>
<script>
  const grid=document.getElementById('blogGrid');
  grid.innerHTML=window.POSTS.map(p=>`
    <a class="post reveal" href="post.html?p=${p.slug}">
      <div class="cover ${p.cover}">${p.icon}</div>
      <div class="body">
        <div class="cat">${p.cat}</div>
        <h3>${p.title}</h3>
        <div class="excerpt">${p.excerpt}</div>
        <div class="meta"><span>${p.author}</span><span class="dot"></span><span>${p.read}</span></div>
      </div>
    </a>`).join('');
  // re-run reveal for newly added
  new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target);}}),{threshold:.12}).takeRecords;
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>{const io=new IntersectionObserver((en,ob)=>en.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');ob.unobserve(x.target);}}),{threshold:.12});io.observe(el);});
</script>
</body>
</html>
