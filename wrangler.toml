name = "outreachnest-website"
compatibility_date = "2026-08-15"
main = "_worker.js"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = [
  "/", "/index.html",
  "/blog", "/blog.html",
  "/download", "/download.html",
  "/services", "/services.html",
  "/niches", "/niches.html",
  "/contact", "/contact.html",
  "/sitemap.xml",
  "/post*",
  "/admin*",
  "/api/*"
]

[[kv_namespaces]]
binding = "LICENSE_KV"
id = "9153ee5559d44c4ea0226699ee4f671f"
